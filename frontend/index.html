<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Movie Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-dark text-white">

<div class="container my-4">
  <h1 class="text-center">🎬 Movie Manager</h1>

  <div class="d-flex justify-content-between my-3">
    <select id="genreFilter" class="form-select w-25">
      <option value="">All Genres</option>
    </select>

    <select id="sortBy" class="form-select w-25">
      <option value="title">Sort by Title</option>
      <option value="rating">Sort by Rating</option>
    </select>
  </div>

  <table class="table table-dark table-bordered">
    <thead>
      <tr>
        <th>Title</th>
        <th>Genre</th>
        <th>Rating</th>
        <th>Favorite</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody id="movieTable"></tbody>
  </table>

  <div class="d-flex justify-content-center">
    <button class="btn btn-outline-light mx-2" id="prevPage">Prev</button>
    <span id="currentPage" class="mx-2"></span>
    <button class="btn btn-outline-light mx-2" id="nextPage">Next</button>
  </div>
</div>

<script>
  let allMovies = [];
  let currentPage = 1;
  const perPage = 5;

  async function fetchMovies() {
    const res = await fetch("http://localhost/film/backend/films.php");
    const data = await res.json();
    allMovies = data;
    updateGenreFilter();
    renderTable();
  }

  function updateGenreFilter() {
    const genres = [...new Set(allMovies.map(m => m.genre))];
    const select = document.getElementById("genreFilter");
    genres.forEach(g => {
      const option = document.createElement("option");
      option.value = g;
      option.textContent = g;
      select.appendChild(option);
    });
  }

  function renderTable() {
    const genre = document.getElementById("genreFilter").value;
    const sort = document.getElementById("sortBy").value;
    let movies = [...allMovies];

    if (genre) movies = movies.filter(m => m.genre === genre);
    if (sort === "title") movies.sort((a, b) => a.title.localeCompare(b.title));
    if (sort === "rating") movies.sort((a, b) => b.rating - a.rating);

    const start = (currentPage - 1) * perPage;
    const paginated = movies.slice(start, start + perPage);

    const table = document.getElementById("movieTable");
    table.innerHTML = "";

    paginated.forEach(m => {
      const row = `<tr>
        <td>${m.title}</td>
        <td>${m.genre}</td>
        <td>${m.rating}</td>
        <td><button class="btn btn-sm btn-warning" onclick="saveFavorite(${m.id})">⭐</button></td>
        <td><button class="btn btn-sm btn-danger" onclick="deleteMovie(${m.id})">🗑️</button></td>
      </tr>`;
      table.innerHTML += row;
    });

    document.getElementById("currentPage").textContent = `Page ${currentPage}`;
  }

  function saveFavorite(id) {
    const movie = allMovies.find(m => m.id === id);
    let favs = JSON.parse(localStorage.getItem("favorites")) || [];
    favs.push(movie);
    localStorage.setItem("favorites", JSON.stringify(favs));
    alert("Added to favorites!");
  }

  function deleteMovie(id) {
    allMovies = allMovies.filter(m => m.id !== id);
    renderTable();
  }

  document.getElementById("genreFilter").addEventListener("change", () => {
    currentPage = 1;
    renderTable();
  });

  document.getElementById("sortBy").addEventListener("change", () => {
    renderTable();
  });

  document.getElementById("prevPage").addEventListener("click", () => {
    if (currentPage > 1) {
      currentPage--;
      renderTable();
    }
  });

  document.getElementById("nextPage").addEventListener("click", () => {
    currentPage++;
    renderTable();
  });

  fetchMovies();
</script>
</body>
</html>
